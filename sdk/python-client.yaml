# openapi-python-client config for the Klopot Python SDK (scripts/generate_sdks.sh).
project_name_override: klopot-client
package_name_override: klopot_client
package_version_override: "1.3.0rc8"
# No formatter run after generation: the output must be byte-identical on
# every machine so the drift check in scripts/check.sh is stable.
post_hooks: []
