version: 2
updates:
  # Python dependencies declared in pyproject.toml — one grouped PR a month.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]
    commit-message:
      prefix: "build"
      include: "scope"

  # GitHub Actions used by the CI workflows — one grouped PR a month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
