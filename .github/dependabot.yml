version: 2
updates:
  # Python dependencies declared in pyproject.toml — one grouped PR a month.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      python:
        patterns: ["*"]
    ignore:
      # 0.30 generates for the "httpx2" fork; the SDK targets httpx
      # (sdk/README.md). Lift when the SDK moves.
      - dependency-name: "openapi-python-client"
        versions: [">=0.30.0"]
    commit-message:
      prefix: "build"
      include: "scope"

  # GitHub Actions used by the CI workflows — one grouped PR a month.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  # npm dev tooling (Playwright, jsdom, axe-core, openapi-typescript) — tests
  # and SDK generation only; nothing of it ships in the image.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    groups:
      npm-dev:
        patterns: ["*"]
    commit-message:
      prefix: "build"
      include: "scope"
