# Klopot's own alerts. Installed automatically on first start (scripts/seed.py);
# reinstalling it later restores a deleted or edited built-in template.
pack:
  id: self-monitoring
  name: {en: "Klopot self-monitoring", ro: "Auto-monitorizare Klopot"}
  description:
    en: "Alerts Klopot raises about itself: a rule switched off after repeated evaluation errors, the daily digest of suppressed alerts, the backup restore drill, and Kurier (the SMS gateway) or its modem not answering."
    ro: "Alertele pe care Klopot le trimite despre el însuși: o regulă oprită după erori repetate de evaluare, rezumatul zilnic al alertelor suprimate, testul de restaurare a backup-ului și Kurier (gateway-ul SMS) sau modemul lui care nu răspunde."
  version: 1.1.0
  tags: [klopot, built-in]
  parameters:
    - name: alert_channel
      label: {en: "Send to channel", ro: "Trimite pe canalul"}
      type: channel
      default: ui_default

version: "1.0"
templates:
  - type: rule_auto_disabled
    severity: warning
    icon: "🛠️"
    category: Self-monitoring
    title_template: "Rule auto-disabled: {rule_name}"
    message_template: >-
      Rule '{rule_name}' (template {template_type}) was auto-disabled after
      {threshold} consecutive eval errors. Last error: {error}. Fix the
      variable binding, then re-enable via PATCH /v1/rules/{rule_id}.
    description: "Built-in silent-decay guard: the engine fires this about itself when a rule can no longer evaluate."
    min_repeat_min: 10
  - type: restore_drill_ok
    severity: info
    icon: "🧯"
    category: Self-monitoring
    title_template: "Backup restore drill PASSED"
    message_template: "Restore drill OK: {detail}"
    description: "Monthly proof that backups actually restore (scripts/restore_drill.sh)."
    min_repeat_min: 0
  - type: daily_suppressed_digest
    severity: info
    icon: "📊"
    category: Self-monitoring
    title_template: "Alert digest: {dispatched} sent, {total_suppressed} suppressed (24h)"
    message_template: >-
      Last 24h: {dispatched} dispatched, {total_suppressed} suppressed
      ({by_reason}). Top suppressed: {top_types}. A persistently high count
      for one type usually means a mis-tuned cooldown or a flapping condition.
    description: "Daily visibility into what Klopot silenced (throttle, quiet hours, inhibition, snooze)."
    min_repeat_min: 0
  - type: restore_drill_failed
    severity: critical
    icon: "🧯"
    category: Self-monitoring
    title_template: "Backup restore drill FAILED"
    message_template: >-
      Restore drill FAILED ({backup}): {detail}. Backups may be unusable —
      investigate before you need them.
    description: "The restore drill could not restore or verify the latest backup (scripts/restore_drill.sh)."
    min_repeat_min: 0
  # Kurier watchdog (ADR-0003): fired by app/core/kurier_watchdog.py when a
  # `kurier` SMS channel has its watchdog on. Route them to Telegram / push
  # too — not only to SMS, the path they report broken.
  - type: kurier_unreachable
    severity: critical
    icon: "📵"
    category: Self-monitoring
    title_template: "Kurier is not answering ({channel})"
    message_template: >-
      Klopot has not reached Kurier for {failed_pings} pings in a row: {error}.
      SMS alerts and Kurier's watchdog SMS are down until it answers.
    description: "Klopot's watchdog ping to Kurier failed three times in a row (ADR-0003)."
    min_repeat_min: 0
  - type: kurier_reachable
    severity: info
    icon: "✅"
    category: Self-monitoring
    title_template: "Kurier answers again ({channel})"
    message_template: "Kurier answers Klopot's watchdog ping again; SMS alerts can go out."
    description: "Recovery of kurier_unreachable."
    min_repeat_min: 0
  - type: kurier_modem_down
    severity: critical
    icon: "📶"
    category: Self-monitoring
    title_template: "Kurier's modem is off the network ({channel})"
    message_template: >-
      Kurier answers, but its modem is not registered (SIM: {sim_state},
      signal: {signal_strength} dBm, operator: {operator}). No SMS can go out.
    description: "Kurier reports its modem unregistered in the watchdog answer (ADR-0003)."
    min_repeat_min: 0
  - type: kurier_modem_up
    severity: info
    icon: "✅"
    category: Self-monitoring
    title_template: "Kurier's modem is back on the network ({channel})"
    message_template: "Modem registered again (operator: {operator}, signal: {signal_strength} dBm)."
    description: "Recovery of kurier_modem_down."
    min_repeat_min: 0
routes:
  - {template: rule_auto_disabled, channel: "${alert_channel}", severity_min: info}
  - {template: restore_drill_ok, channel: "${alert_channel}", severity_min: info}
  - {template: daily_suppressed_digest, channel: "${alert_channel}", severity_min: info}
  - {template: restore_drill_failed, channel: "${alert_channel}", severity_min: info}
  - {template: kurier_unreachable, channel: "${alert_channel}", severity_min: info}
  - {template: kurier_reachable, channel: "${alert_channel}", severity_min: info}
  - {template: kurier_modem_down, channel: "${alert_channel}", severity_min: info}
  - {template: kurier_modem_up, channel: "${alert_channel}", severity_min: info}
